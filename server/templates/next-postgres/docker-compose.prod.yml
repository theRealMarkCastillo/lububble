services:
  web:
    build:
      context: .
      target: runner
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lububble:lububble@db:5432/app
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lububble
      POSTGRES_PASSWORD: lububble
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lububble"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - pg-data-prod:/var/lib/postgresql/data
  db-migrate:
    build:
      context: .
      target: migrate
    command: ["npx", "drizzle-kit", "migrate", "--config", "drizzle.config.ts"]
    environment:
      DATABASE_URL: postgres://lububble:lububble@db:5432/app
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg-data-prod:
